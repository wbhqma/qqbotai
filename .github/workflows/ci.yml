name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check code format
        run: python -m black --check .
      - name: Check dependencies
        run: python -m pip check
      - name: Check public files for private data
        run: python -X utf8 scripts/check_privacy.py
      - name: Run offline tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Check bot assembly without credentials
        run: python -X utf8 bot.py --check
      - name: Check PowerShell installation script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QQBOT_PYTHON = (Get-Command python).Source
          $env:QQBOT_VENV = Join-Path $env:RUNNER_TEMP 'qqbot-napcat-env'
          ./setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./start.ps1 -Check
